[package]
name = "master_protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Versioned control and opaque relay protocol shared by iw4l and iw4l-master."

[lints]
workspace = true

# The congestion controller is QUIC-only; the browser never builds a QUIC connection.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quinn-proto = { version = "0.11.17", default-features = false }
