<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iw4l</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #ddd; }
  /* The canvas size is owned by Bevy/winit (Window::fit_canvas_to_parent:
     canvas fills its parent and resize events drive the render surface and
     input coordinates). Do not size the canvas here: CSS-only stretching
     leaves Bevy at its startup resolution, so clicks map to the old small
     canvas. Sizing only the parent avoids that and the feedback loop warned
     about in the Bevy docs. */
  canvas { display: block; outline: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; font: 14px system-ui, sans-serif; z-index: 10; background: #000; }
  #loading .bar { width: min(360px, 70vw); height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
  #loading .fill { height: 100%; width: 0; background: #ddd; transition: width .1s linear; }
  #loading .fill.indeterminate { width: 30%; animation: slide 1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 70%; } }
</style>
</head>
<body>
<div id="loading"><div id="loading-msg">Downloading game data…</div>
  <div class="bar"><div class="fill indeterminate" id="loading-fill"></div></div></div>
<script>
// Audio unlock. A classic script: the wasm glue reads the AudioContext global when the module
// below is evaluated, so the wrapper must already be in place. A context made before the first
// gesture starts suspended, and Chrome only honours resume() with user activation. Every AudioContext the engine makes is tracked;
// the first pointer/key/touch gesture resumes them, and the listeners stay until all run
// (the match's output stream is created after the gesture, at map load).
const audioContexts = [];
function resumeAudio() {
  for (const ctx of audioContexts) {
    if (ctx.state === 'running') continue;
    ctx.resume().then(
      () => console.info(`audio: context resumed (${ctx.sampleRate} Hz)`),
      () => {}, // no activation yet; the next gesture tries again
    );
  }
  if (audioContexts.every((ctx) => ctx.state === 'running') && audioContexts.length) {
    // Later contexts re-arm it below.
    for (const type of gestures) removeEventListener(type, resumeAudio, true);
    armed = false;
  }
}
const gestures = ['pointerdown', 'keydown', 'touchend'];
let armed = false;
function armAudio() {
  if (armed) return;
  armed = true;
  for (const type of gestures) addEventListener(type, resumeAudio, true);
}
if (window.AudioContext) {
  const NativeAudioContext = window.AudioContext;
  window.AudioContext = class extends NativeAudioContext {
    constructor(...args) {
      super(...args);
      audioContexts.push(this);
      armAudio();
      if (navigator.userActivation?.hasBeenActive) resumeAudio();
    }
  };
}
armAudio();

// The worklet ring-buffer player (audio crate, web_output.rs); the build adds a version tag to the URL.
window.iw4lMixerUrl = './iw4l-mixer.js';
window.iw4l = {
  audio() {
    return audioContexts.map((ctx) => ({ state: ctx.state, sampleRate: ctx.sampleRate }));
  },
  // Browser output counters (web_output.rs publish_stats): consumed frames, bufferedMs,
  // underruns, peak/rms, blocks rendered per frame, control/render/decode ms, refreshed every 30 frames.
  mixer() {
    return window.iw4lMixerStats;
  },
};
</script>
<script type="module">
// Launch args default to mp_rust and can be overridden with ?map=<zone>&cmds=<script>, see launcher/src/web.rs.
// ?pack=<url> is read here. ?log=1 turns on the engine's info lines in the console.
import init, { artifacts, artifact, set_console_log } from './iw4l.js';

// What the run wrote (log, acceptance summary, captures, reports), kept in memory:
//   iw4l.artifacts()        -> [{ path, bytes }]
//   iw4l.artifact(path)     -> Uint8Array | undefined
//   iw4l.text(path)         -> string | undefined
//   iw4l.download(path)     -> saves it through the browser
//   iw4l.log(on = true)     -> engine info/debug lines in this console (off by default;
//                              warnings and errors always show, the log artifact has all)
//   iw4l.audio()            -> [{ state, sampleRate }] for every AudioContext the engine made
//                              (defined by the classic script above, see there)
Object.assign(window.iw4l, {
  artifacts,
  artifact,
  log(on = true) {
    set_console_log(on);
  },
  text(path) {
    const bytes = artifact(path);
    return bytes && new TextDecoder().decode(bytes);
  },
  download(path) {
    const bytes = artifact(path);
    if (!bytes) throw new Error(`no artifact ${path}`);
    const url = URL.createObjectURL(new Blob([bytes]));
    const link = document.createElement('a');
    link.href = url;
    link.download = path.split('/').pop();
    link.click();
    URL.revokeObjectURL(url);
  },
});

// Loading overlay: one bar over the wasm + pack downloads, removed once the engine's canvas appears.
const loadingMsg = document.getElementById('loading-msg');
const loadingFill = document.getElementById('loading-fill');
const progress = { wasm: [0, 0], pack: [0, 0] }; // [loaded, total] bytes; total 0 while unknown
function showProgress() {
  const loaded = progress.wasm[0] + progress.pack[0];
  const total = progress.wasm[1] + progress.pack[1];
  const known = progress.wasm[1] > 0 && progress.pack[1] > 0;
  const mb = (n) => (n / 1048576).toFixed(1);
  if (known) {
    const pct = Math.min(100, (loaded / total) * 100);
    loadingFill.classList.remove('indeterminate');
    loadingFill.style.width = `${pct}%`;
    loadingMsg.textContent = `Downloading game data… ${Math.floor(pct)}% (${mb(loaded)} / ${mb(total)} MB)`;
  } else {
    loadingMsg.textContent = `Downloading game data… ${mb(loaded)} MB`;
  }
}
// Passes a response body through, counting bytes into progress[key].
function tracked(response, key) {
  // Decoded size: a gzipped response's content-length is the compressed size, so the server
  // (scripts/web_serve.py) also sends the original one.
  progress[key][1] = Number(response.headers.get('x-uncompressed-length')
    || response.headers.get('content-length')) || 0;
  const counter = new TransformStream({
    transform(chunk, controller) {
      progress[key][0] += chunk.byteLength;
      showProgress();
      controller.enqueue(chunk);
    },
  });
  return new Response(response.body.pipeThrough(counter), response);
}
new MutationObserver((_, observer) => {
  if (!document.querySelector('canvas')) return;
  document.getElementById('loading')?.remove();
  observer.disconnect();
}).observe(document.body, { childList: true, subtree: true });

// The wasm download + compile starts now, in parallel with the pack download below;
// init() only instantiates it once the pack is in place (main reads window.iw4l_pack).
const wasmModule = WebAssembly.compileStreaming(fetch('./iw4l_bg.wasm').then((r) => tracked(r, 'wasm')));
wasmModule.catch(() => {}); // reported where init() awaits it, not as an unhandled rejection

// The game files come from a pack (xtask web-pack) kept in this JS buffer, outside
// wasm memory: ?pack=<url>, default ./game.pack next to this page. Never bundled.
const packUrl = new URLSearchParams(location.search).get('pack') || './game.pack';
// The pack is far too big for the HTTP cache (and the dev server sends no validators), so it
// lives in the Cache API, revalidated with a HEAD on Last-Modified/ETag + Content-Length.
async function fetchPack(url) {
  let cache = null;
  try { cache = await caches.open('iw4l-pack'); } catch { /* insecure context / blocked */ }
  if (!cache) return fetch(url);
  const sig = (r) => [r.headers.get('etag'), r.headers.get('last-modified'),
    r.headers.get('content-length')].join('|');
  const cached = await cache.match(url);
  if (cached) {
    try {
      const head = await fetch(url, { method: 'HEAD', cache: 'no-store' });
      if (head.ok && sig(head) === sig(cached)) return cached;
    } catch { return cached; } // offline: better stale than nothing
  }
  const response = await fetch(url, { cache: 'no-store' });
  if (response.ok) {
    // clone() must happen now: once the caller reads the body it is too late.
    const copy = response.clone();
    cache.delete(url).then(() => cache.put(url, copy))
      .catch((e) => console.warn('pack not cached:', e)); // e.g. over storage quota
  }
  return response;
}
try {
  const response = await fetchPack(packUrl);
  if (!response.ok) throw new Error(`pack ${packUrl}: HTTP ${response.status}`);
  window.iw4l_pack = new Uint8Array(await tracked(response, 'pack').arrayBuffer());
  console.log(`pack ${packUrl}: ${window.iw4l_pack.length} bytes`);
} catch (error) {
  // Not fatal here: the app starts and reports the missing game files itself.
  console.error(error);
  loadingMsg.textContent = `Could not load game data: ${error.message}`;
}

if (window.iw4l_pack) loadingMsg.textContent = 'Starting engine…';
loadingFill.classList.add('indeterminate');
try {
  await init({ module_or_path: wasmModule });
} catch (error) {
  // winit leaves its event loop by throwing; that one is not a failure.
  if (!String(error).includes('Using exceptions for control flow')) {
    console.error(error);
  }
}
</script>
</body>
</html>
