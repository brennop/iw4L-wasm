<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iw4l</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; }
  canvas { display: block; outline: none; }
</style>
</head>
<body>
<script>
// Audio unlock. A classic script: the wasm glue reads the AudioContext global when the module
// below is evaluated, so the wrapper must already be in place. A context made before the first
// gesture starts suspended, and Chrome only honours resume() with user activation. Every AudioContext the engine makes is tracked;
// the first pointer/key/touch gesture resumes them, and the listeners stay until all run
// (the match's output stream is created after the gesture, at map load).
const audioContexts = [];
function resumeAudio() {
  for (const ctx of audioContexts) {
    if (ctx.state === 'running') continue;
    ctx.resume().then(
      () => console.info(`audio: context resumed (${ctx.sampleRate} Hz)`),
      () => {}, // no activation yet; the next gesture tries again
    );
  }
  if (audioContexts.every((ctx) => ctx.state === 'running') && audioContexts.length) {
    // Later contexts re-arm it below.
    for (const type of gestures) removeEventListener(type, resumeAudio, true);
    armed = false;
  }
}
const gestures = ['pointerdown', 'keydown', 'touchend'];
let armed = false;
function armAudio() {
  if (armed) return;
  armed = true;
  for (const type of gestures) addEventListener(type, resumeAudio, true);
}
if (window.AudioContext) {
  const NativeAudioContext = window.AudioContext;
  window.AudioContext = class extends NativeAudioContext {
    constructor(...args) {
      super(...args);
      audioContexts.push(this);
      armAudio();
      if (navigator.userActivation?.hasBeenActive) resumeAudio();
    }
  };
}
armAudio();

window.iw4l = {
  audio() {
    return audioContexts.map((ctx) => ({ state: ctx.state, sampleRate: ctx.sampleRate }));
  },
};
</script>
<script type="module">
// Launch args come from this page's query string: ?map=<zone>&cmds=<script>, see launcher/src/web.rs.
// ?pack=<url> is read here. ?log=1 turns on the engine's info lines in the console.
import init, { artifacts, artifact, set_console_log } from './iw4l.js';

// What the run wrote (log, acceptance summary, captures, reports), kept in memory:
//   iw4l.artifacts()        -> [{ path, bytes }]
//   iw4l.artifact(path)     -> Uint8Array | undefined
//   iw4l.text(path)         -> string | undefined
//   iw4l.download(path)     -> saves it through the browser
//   iw4l.log(on = true)     -> engine info/debug lines in this console (off by default;
//                              warnings and errors always show, the log artifact has all)
//   iw4l.audio()            -> [{ state, sampleRate }] for every AudioContext the engine made
//                              (defined by the classic script above, see there)
Object.assign(window.iw4l, {
  artifacts,
  artifact,
  log(on = true) {
    set_console_log(on);
  },
  text(path) {
    const bytes = artifact(path);
    return bytes && new TextDecoder().decode(bytes);
  },
  download(path) {
    const bytes = artifact(path);
    if (!bytes) throw new Error(`no artifact ${path}`);
    const url = URL.createObjectURL(new Blob([bytes]));
    const link = document.createElement('a');
    link.href = url;
    link.download = path.split('/').pop();
    link.click();
    URL.revokeObjectURL(url);
  },
});

// The wasm download + compile starts now, in parallel with the pack download below;
// init() only instantiates it once the pack is in place (main reads window.iw4l_pack).
const wasmModule = WebAssembly.compileStreaming(fetch('./iw4l_bg.wasm'));
wasmModule.catch(() => {}); // reported where init() awaits it, not as an unhandled rejection

// The game files come from a pack (xtask web-pack) kept in this JS buffer, outside
// wasm memory: ?pack=<url>, default ./game.pack next to this page. Never bundled.
const packUrl = new URLSearchParams(location.search).get('pack') || './game.pack';
try {
  const response = await fetch(packUrl);
  if (!response.ok) throw new Error(`pack ${packUrl}: HTTP ${response.status}`);
  window.iw4l_pack = new Uint8Array(await response.arrayBuffer());
  console.log(`pack ${packUrl}: ${window.iw4l_pack.length} bytes`);
} catch (error) {
  // Not fatal here: the app starts and reports the missing game files itself.
  console.error(error);
}

try {
  await init({ module_or_path: wasmModule });
} catch (error) {
  // winit leaves its event loop by throwing; that one is not a failure.
  if (!String(error).includes('Using exceptions for control flow')) {
    console.error(error);
  }
}
</script>
</body>
</html>
