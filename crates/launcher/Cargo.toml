[package]
name = "launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The binary. Process entry only: allocator, argv, env, log init; assembly lives in bootstrap."

[[bin]]
name = "iw4l"
path = "src/main.rs"

[features]
bevy-debug = ["bootstrap/bevy-debug"]
bevy-trace = ["bootstrap/bevy-trace"]

[dependencies]
diag.workspace = true
gamefs.workspace = true
assets.workspace = true
bootstrap = { path = "../bootstrap" }

# Web build: WebGPU backend for wgpu. Cargo unifies features per target, so this
# adds `webgpu` on wasm32 only and leaves native feature sets untouched.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }

[lints]
workspace = true
