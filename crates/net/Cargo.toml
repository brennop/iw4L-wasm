[package]
name = "net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Our wire: frames, deltas, prediction, interpolation. Not retail's netcode."

[dependencies]
web-time = { workspace = true }
diag.workspace = true
math_iw4.workspace = true
frame.workspace = true
playerstate_iw4.workspace = true
entity_iw4.workspace = true
anim_iw4.workspace = true
xmodel_runtime.workspace = true
movement_iw4.workspace = true
input_iw4.workspace = true
weapon_iw4.workspace = true
gamemode_iw4.workspace = true
killcam_iw4.workspace = true
sim.workspace = true
hud_iw4.workspace = true
perf.workspace = true
bevy.workspace = true
master_protocol.workspace = true
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

# Online transport (master relay over QUIC, UDP socket sizing, snapshot zstd).
# None of it builds for wasm32, so the crates are target-specific; wasm32 gets
# its own set below. The `online` cfg (build.rs) follows the feature.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytes = { version = "1", optional = true }
quinn = { version = "0.11.11", default-features = false, features = ["platform-verifier", "runtime-tokio", "rustls-ring"], optional = true }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"], optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
rustls-platform-verifier = { version = "0.7.0", optional = true }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
socket2 = { version = "0.6.5", optional = true }
zstd = { version = "0.13", default-features = false, optional = true }

# Browser online (join only): the master worker over WebTransport on the page's
# event loop. tokio is only `sync` + `select!` here; timers and spawning are
# `master/rt_web.rs`. ruzstd decodes the native host's zstd snapshots.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
js-sys = { version = "0.3", optional = true }
ruzstd = { version = "0.9", default-features = false, features = ["std"], optional = true }
tokio = { version = "1.47", default-features = false, features = ["macros", "sync"], optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Location",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "UrlSearchParams",
    "Window",
    "WritableStream",
    "WritableStreamDefaultWriter",
] }

[features]
default = ["online"]
online = [
    "dep:bytes",
    "dep:quinn",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-platform-verifier",
    "dep:tokio",
    "dep:socket2",
    "dep:zstd",
    "dep:futures-util",
    "dep:js-sys",
    "dep:ruzstd",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[lints]
workspace = true
