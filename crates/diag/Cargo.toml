[package]
name = "diag"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Process diagnostics: Channel/Level sinks, JSONL traces, counting allocator."

[dependencies]
artifactfs.workspace = true
web-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", default-features = false }

[lints]
workspace = true
