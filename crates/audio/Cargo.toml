[package]
name = "audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sound aliases and mixing."

[dependencies]
web-time = { workspace = true }
diag.workspace = true
bevy.workspace = true
asset_audio.workspace = true
asset_core.workspace = true
asset_game.workspace = true
asset_transport.workspace = true
assets.workspace = true
asset_iw4.workspace = true
movement_iw4.workspace = true
frame.workspace = true
entity_iw4.workspace = true
net.workspace = true
sim.workspace = true
hud_iw4 = { path = "../hud_iw4" }
playerstate_iw4.workspace = true
gamemode_iw4.workspace = true
perf.workspace = true
symphonia = { version = "0.5", default-features = false, features = ["mp3", "pcm", "wav", "adpcm"] }

# U8 (experimental): the browser mixes on an AudioWorklet, see `worklet.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BaseAudioContext",
    "MessageEvent",
    "MessagePort",
] }

[lints]
workspace = true
