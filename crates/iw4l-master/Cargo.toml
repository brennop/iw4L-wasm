[package]
name = "iw4l-master"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Standalone relay-only IW4L master, browser and opaque packet service."

[dependencies]
bytes = "1"
httparse = "=1.10.1"
getrandom = "0.3"
ring = "0.17"
master_protocol.workspace = true
quinn = { version = "0.11.11", default-features = false, features = ["platform-verifier", "runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.7.0"
wtransport = { version = "0.7.2", default-features = false, features = ["quinn", "ring", "self-signed"] }
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-util = { version = "0.7", default-features = false }

[lints]
workspace = true
